<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WorkHub · AI Assistant</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18263f;background:#f6f8fc}
    *{box-sizing:border-box} body{margin:0} .shell{max-width:960px;margin:auto;padding:22px 18px}
    a{color:#3157a4;text-decoration:none} a:hover{text-decoration:underline}
    header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:4px 0 20px}
    h1{font-size:26px;line-height:1.3;margin:4px 0} small,.subtle{color:#68788f}
    .chat{background:white;border:1px solid #e2e7ef;border-radius:16px;box-shadow:0 9px 30px #1d355708;overflow:hidden}
    #messages{min-height:320px;height:min(55vh,520px);overflow:auto;display:flex;flex-direction:column;gap:15px;padding:20px}
    .message{max-width:85%;border-radius:13px;padding:12px 15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
    .message.user{align-self:flex-end;background:#e9efff}.message.assistant{align-self:flex-start;background:#f2f5f9}
    .meta{margin-top:8px;color:#637389;font-size:12px}
    form{border-top:1px solid #e2e7ef;padding:14px;display:flex;gap:10px;align-items:flex-end}
    textarea{font:inherit;line-height:1.5;border:1px solid #bdc9dc;border-radius:9px;padding:10px 12px;resize:vertical;min-height:54px;max-height:180px;flex:1}
    button{border:0;border-radius:9px;background:#3157a4;color:white;padding:13px 19px;font:inherit;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    #status{min-height:24px;color:#667791;font-size:13px;padding:0 16px 12px}
    #status.error{color:#b42318}
    @media(max-width:600px){.shell{padding:14px 10px}.message{max-width:96%}#messages{height:57vh}}
  </style>
  <script src="/assets/ai-chat.js" defer></script>
</head>
<body>
<main class="shell">
  <header>
    <div><a href="/">← 返回 WorkHub</a><h1>AI Assistant</h1><small>知识库检索 · 授权工单查询 · 只读建议</small></div>
    <div id="identity" class="subtle" aria-live="polite"></div>
  </header>
  <section class="chat" aria-label="AI 助手聊天">
    <div id="messages" role="log" aria-live="polite">
      <div class="message assistant">你好，我可以帮助你查询 WorkHub 知识库，以及你有权限查看的 Ticket。不会自动修改工单。</div>
    </div>
    <form id="chatForm">
      <label for="question" style="position:absolute;width:1px;height:1px;overflow:hidden">输入问题</label>
      <textarea id="question" maxlength="2000" placeholder="例如：Ticket #16 当前状态是什么？" required></textarea>
      <button id="sendButton" type="submit">发送</button>
    </form>
    <div id="status" role="status"></div>
  </section>
</main>
</body>
</html>
